min_version = "2026.9.1"

[settings]
# only install versions released more than 7 days ago
minimum_release_age = "7d"
# assume this repo is cloned to this path:
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"
# Let mise read `.nvmrc` / `.node-version` in a project directory and
# auto-switch the active node version there (replaces fnm --use-on-cd).
idiomatic_version_file_enable_tools = ["node"]

[settings.upgrade]

[tools]
# gh and opencode are only used on Linux (Arch), not macOS.
gh = { version = "latest", os = ["linux"] }
go = "latest"
# sesh ships prebuilt binaries in GitHub releases; AUR (sesh-bin) and
# Homebrew (joshmedeski/sesh) lag behind, so install straight from the
# tagged releases instead.
"github:joshmedeski/sesh" = "latest"
node = "26"
# Official mise registry shorthand → npm:@nubjs/nub (same on macOS and Linux).
nub = "latest"
opencode = { version = "latest", os = ["linux"] }
python = "3.14.4"
rust = "latest"
uv = "latest"
"aqua:modem-dev/hunk" = "latest"
"aqua:rust-lang/rustup" = "latest"
"npm:cf" = { version = "latest", prerelease = true, minimum_release_age = "0s", os = ["linux"] }
"npm:playwright" = "latest"
"npm:@agentika/grepika" = "latest"
"cargo:tilth" = "latest"

[bootstrap.secrets]
gitlab_instance = "GITLAB_INSTANCE"
# Email used in git commits (user.email, rendered into .gitconfig.tmpl).
git_user_email = "GIT_USER_EMAIL"
# Username that should own the lazygit config. Defaults to the user who ran
# the bootstrap (iain on this Linux box) unless LAZYGIT_OWNER is set (e.g. a
# different username on macOS). Enforced by the bootstrap task below.
lazygit_owner = "LAZYGIT_OWNER"

[dotfiles]
# Root files and dirs (shared across Linux and macOS).
"~/.agents/skills" = { mode = "symlink-each", exclude = ["dotfiles-mise"] }
"~/.bashrc" = {}
"~/.cargo" = {}
# ~/.config (shared across platforms).
# Whole-dir symlink mode for dirs currently symlinked,
# symlink-each for dirs that also carry machine-generated/untracked files.
# Manifest for the ariadne MCP runtime; the bootstrap task installs it into
# ~/.local/share/ariadne-mcp (nothing is written back into this dir).
"~/.config/ariadne-mcp" = {}
"~/.config/bat" = {}
"~/.config/commit-mono-font" = {}
"~/.config/fastfetch/.prettierrc" = { mode = "copy" }
"~/.config/fastfetch/config.jsonc" = { source = "../fastfetch/config.jsonc.tmpl", mode = "template" }
"~/.config/fish" = {}
"~/.config/hunk" = { mode = "symlink-each" }
"~/.config/kitty/kitty.conf" = { source = "../kitty/kitty.conf.tmpl", mode = "template" }
"~/.config/kitty/tokyonight_night.conf" = { mode = "copy" }
"~/.config/lazygit/.gitignore" = { mode = "copy" }
"~/.config/lazygit/config.yml" = { source = "templates/lazygit.config.yml", mode = "template" }
"~/.config/mise" = {}
"~/.config/ov" = {}
"~/.config/sesh" = {}
"~/.config/starship.toml" = {}
"~/.config/tmux" = {}
"~/.config/yazi" = {}
# Rendered from `.gitconfig.tmpl`; macOS-only bits (osxkeychain, pbcopy/open
# aliases, ~/dev/Squiz includeIf) are OS-gated in the template.
"~/.gitconfig" = { source = "../../.gitconfig.tmpl", mode = "template" }
"~/bin" = {}
"~/CommitMono_iainsimmonsV143" = {}
"~/epomaker_split65.layout.json" = {}

[tasks.bootstrap]
run = """
set -euo pipefail

# ariadne MCP server. The published @ariadnejs/mcp pins tree-sitter 0.25.0,
# which ships no prebuilt bindings and needs C++20 flags to compile on Node 26;
# the override in ~/.config/ariadne-mcp/package.json forces 0.25.1, whose napi
# prebuilds (linux/darwin, x64/arm64) need no toolchain. Install into a stable
# prefix so Node upgrades can't delete it, and skip lifecycle scripts since
# nothing here compiles.
ARIADNE_PREFIX="$HOME/.local/share/ariadne-mcp"
ARIADNE_MANIFEST="$HOME/.config/ariadne-mcp/package.json"
if [ -f "$ARIADNE_MANIFEST" ] && command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
  mkdir -p "$ARIADNE_PREFIX"
  if [ ! -f "$ARIADNE_PREFIX/node_modules/@ariadnejs/mcp/dist/cli.js" ] ||
     ! cmp -s "$ARIADNE_MANIFEST" "$ARIADNE_PREFIX/package.json"; then
    echo "Installing ariadne MCP server..."
    cp "$ARIADNE_MANIFEST" "$ARIADNE_PREFIX/package.json"
    (cd "$ARIADNE_PREFIX" && npm install --no-audit --no-fund --ignore-scripts)
  fi
fi

# A global install would shadow bin/ariadne-mcp on PATH (mise puts node's bin
# dir ahead of ~/bin) and gets wiped on every Node bump. The prefix above is
# authoritative, so drop any stray global copy.
if command -v npm >/dev/null 2>&1 && npm ls -g --depth=0 @ariadnejs/mcp >/dev/null 2>&1; then
  echo "Removing stray global @ariadnejs/mcp..."
  npm uninstall -g @ariadnejs/mcp >/dev/null 2>&1 || true
fi

# yazi plugin packages (deployed to ~/.cache/yazi/packages; only right after a
# fresh yazi install / cleared cache).
if command -v yazi >/dev/null 2>&1 && command -v ya >/dev/null 2>&1 && \
   [ ! -d "$HOME/.cache/yazi/packages" ]; then
  echo "Installing yazi packages..."
  ya pkg install
fi

# bat: Tokyo Night theme + rebuild cache.
if command -v bat >/dev/null 2>&1 && ! bat --list-themes 2>/dev/null | grep -q tokyonight; then
  echo "Adding tokyonight bat theme..."
  mkdir -p "$(bat --config-dir)/themes"
  curl -sSLo "$(bat --config-dir)/themes/tokyonight_night.tmTheme" \
    https://raw.githubusercontent.com/folke/tokyonight.nvim/main/extras/sublime/tokyonight_night.tmTheme
  bat cache --build
fi

# Fonts dir (Linux: ~/.local/share/fonts, macOS: ~/Library/Fonts).
if [ "$(uname -s)" = "Darwin" ]; then
  FONT_DEST="$HOME/Library/Fonts/CommitMono"
else
  FONT_DEST="$HOME/.local/share/fonts/CommitMono"
fi
if [ ! -d "$FONT_DEST" ]; then
  echo "Installing CommitMono fonts..."
  mkdir -p "$FONT_DEST"
  cp "$HOME/dotfiles/CommitMono_iainsimmonsV143/"*.otf "$FONT_DEST/"
fi
if [ "$(uname -s)" != "Darwin" ]; then
  command -v fc-cache >/dev/null 2>&1 && fc-cache -f >/dev/null 2>&1 || true
  command -v omarchy-font-set >/dev/null 2>&1 && omarchy-font-set CommitMono_iainsimmons || true
fi

# TickTick as a webapp (Linux omarchy tooling).
if [ "$(uname -s)" = "Linux" ] && command -v omarchy-webapp-install >/dev/null 2>&1 && \
   ! grep -i "Name=TickTick" "$HOME"/.local/share/applications/*.desktop >/dev/null 2>&1; then
  echo "Installing TickTick webapp..."
  omarchy-webapp-install TickTick "https://ticktick.com/webapp" ""
fi

# Karabiner (macOS): seed/merge the caps_lock complex_modification into the
# machine-owned karabiner.json that Karabiner rewrites on device changes.
if [ "$(uname -s)" = "Darwin" ] && [ -x "$HOME/dotfiles/bin/karabiner-apply-rule.sh" ]; then
  echo "Applying Karabiner complex_modifications..."
  "$HOME/dotfiles/bin/karabiner-apply-rule.sh"
fi

# Ensure the lazygit config is owned by the user who ran this bootstrap (or
# $LAZYGIT_OWNER if set). No-op when it's already owned by that user; silently
# skipped if we lack permission. Only meaningful after the bootstrap ever ran
# under sudo (then $SUDO_USER holds the original account).
if [ -f "$HOME/.config/lazygit/config.yml" ]; then
  cfg_owner="${LAZYGIT_OWNER:-${SUDO_USER:-${USER:-$(id -un)}}}"
  chown "$cfg_owner" "$HOME/.config/lazygit/config.yml" 2>/dev/null || true
fi

# vite-plus (Linux only). Tests the install path rather than `command -v vp`,
# because `vp` is not on PATH until ~/.config/vite-plus/env.fish is sourced.
if [ "$(uname -s)" = "Linux" ] && [ ! -x "$HOME/.local/share/vite-plus/bin/vp" ]; then
  echo "Installing vite-plus..."
  curl -fsSL https://vite.plus | bash
fi
"""
