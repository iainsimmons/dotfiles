# Linux-only dotfiles and host packages (auto-loaded via auto_env on linux).
# Cross-platform equivalents live in config.toml / config.macos.toml.

[dotfiles]
"~/.config/hypr" = { mode = "symlink-each", exclude = [
  "monitors.lua",
] } # real dir; per-file links (Omarchy quattro layout)
# Cloned workspaces bar widget (numbers + active underline). Copy mode because
# `omarchy plugin validate` rejects symlinks inside a plugin folder. Tracked as a
# directory so machine-installed plugins next to it stay untracked.
"~/.config/omarchy/plugins/iain.workspaces" = { mode = "copy" }
# opencode: symlink each tracked file so per-machine plugins (e.g. peon-ping,
# desktop-only via config.desktop.toml) can be added/omitted per machine.
# node_modules / package*.json / bun.lock are gitignored machine-owned files.
"~/.config/opencode" = { mode = "symlink-each", exclude = [
  "node_modules",
  "package.json",
  "package-lock.json",
  "bun.lock",
] }
"~/.config/uwsm" = { mode = "symlink-each" }
"~/.config/walker" = {}
# vite-plus is Linux-only. config.json is tracked; the env/env.* shell files are
# regenerated by the vite-plus installer (see [tasks.bootstrap] in config.toml).
"~/.config/vite-plus/config.json" = {}

[bootstrap.packages]
"pacman:fish" = "latest"
"pacman:kitty" = "latest"
"pacman:tmux" = "latest"
"pacman:tree-sitter-cli" = "latest"
"pacman:yazi" = "latest"
"pacman:eza" = "latest"
"pacman:fx" = "latest"
"pacman:gum" = "latest"
"pacman:7zip" = "latest"
"pacman:diff-so-fancy" = "latest"
"pacman:fastfetch" = "latest"
"pacman:uwsm" = "latest"
"pacman:walker" = "latest"
"aur:ov" = "latest"
"aur:helium-browser-bin" = "latest"
"aur:vesktop-bin" = "latest"
"aur:bibata-cursor-theme-bin" = "latest"
"aur:pnpm-bin" = "latest"
"aur:rapidraw-bin" = "latest"
