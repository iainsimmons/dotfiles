# Desktop-specific tool/package overrides (loaded with MISE_ENV=desktop).
# The desktop is the same Arch/Omarchy setup, but with the gaming/entertainment
# tools that the MacBook omits. Shared Linux packages live in config.linux.toml.

[tools]

[dotfiles]
# peon-ping (opencode sound/hooks plugin): desktop only. The plugin source
# lives at ~/dotfiles/.config/desktop/..., a path mise never syncs; it is
# symlinked into the shared opencode plugins dir here so the MacBook never
# sees it.
"~/.config/opencode/plugins/peon-ping.ts" = { source = "../desktop/opencode/plugins/peon-ping.ts", mode = "symlink" }

[bootstrap.packages]
# Gaming on the desktop only (the MacBook does not get Steam).
"pacman:steam" = { os = "linux" }