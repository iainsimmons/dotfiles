# MacBook-specific tool/package overrides (loaded with MISE_ENV=macbook).
# The MacBook is the same Arch/Omarchy setup as the desktop, but lighter on
# gaming/entertainment tools and with the keyboard remapper enabled.
#
# Tools/packages that the desktop has but the MacBook does NOT need are simply
# not declared here — mise packages are additive and cannot express "absent".
# Steam lives in config.desktop.toml (MISE_ENV=desktop), so it never installs
# here.

[tools]

[dotfiles]
# MacBook-only Hyprland input override. The shared input.lua keeps the
# desktop-mouse sensitivity (-0.75); this restores faster touchpad tracking.
# Loaded from hyprland.lua only when this file is present (no-op elsewhere).
"~/.config/hypr/input.macbook.lua" = { source = "../macbook/hypr/input.macbook.lua", mode = "symlink" }

[bootstrap.packages]
# Keyboard remapper used specifically on the MacBook (disabled on the desktop
# in config.linux.toml).
"aur:evremap-git" = { os = "linux" }

[bootstrap.linux.systemd.units]
# evremap key remapper, enabled only on the MacBook.
evremap = { description = "evremap key remapper", exec_start = "~/.config/evremap/setup_evremap.sh", restart = "on-failure" }