# macOS-only dotfiles and host packages (auto-loaded via auto_env on macOS).
# Cross-platform equivalents live in config.toml / config.linux.toml.
# Ported from the `main` branch's macOS setup (the Brewfile).

# Tools that only need to exist on macOS (installed by mise, not Homebrew).
# Runtime/toolchain versions (node, go, python, gh, opencode, codex) are shared
# in config.toml, so they are not repeated here.
[tools]
"go:github.com/ChausseBenjamin/termpicker" = "latest"
"npm:@squiz/dxp-cli-next" = "latest"
"npm:corepack" = "latest"

[dotfiles]
"~/.zshrc" = {}
"~/.config/espanso" = {}
"~/.config/skhd" = {}
"~/.config/svgo.config.mjs" = {}
# karabiner: NOT a dotfile — Karabiner Elements rewrites karabiner.json on
# device connect/disconnect, so it stays machine-owned. The caps_lock
# complex_modification is seeded/merged into it by bin/karabiner-apply-rule.sh
# (wired into the `bootstrap` task) from .config/karabiner/karabiner.seed.json
# "~/.config/ghostty" = {}   # deleted — kitty is the terminal everywhere

# Note: kitty is the terminal everywhere but is not in the Brewfile — it is
# installed separately (on macOS via `brew install --cask kitty`), so it has no
# entry here. Do not add `brew:kitty` (no such formula).

# Third-party Homebrew taps used by the formulas/casks below. mise reads each
# tap's published API metadata directly; these sources are only needed where
# the conventional GitHub URL cannot be inferred.
[bootstrap.brew.taps]
"jesseduffield/lazydocker" = "https://github.com/jesseduffield/homebrew-lazydocker.git"
"jesseduffield/lazygit" = "https://github.com/jesseduffield/homebrew-lazygit.git"
"noahgorstein/tap" = "https://github.com/noahgorstein/homebrew-tap.git"
"noborus/tap" = "https://github.com/noborus/homebrew-tap.git"

